[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blot-loc"
version = "1.0.0"
description = "A cross-platform command-line tool for counting lines of code."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Akhilesh Varma" }]
keywords = ["loc", "lines-of-code", "code-metrics", "cli", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = ["Pygments>=2.17"]

[project.scripts]
blot = "blot.cli:main"

[project.urls]
Homepage = "https://github.com/ak495867/Blot"
Repository = "https://github.com/ak495867/Blot"
Issues = "https://github.com/ak495867/Blot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blot"]
